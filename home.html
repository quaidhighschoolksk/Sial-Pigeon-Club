<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Tournament</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  :root{
    --green: #4C7A5E;
    --green-dark: #3C6249;
    --bg: #F5F7F5;
    --card: #FFFFFF;
    --entry-bg: #EAF5EC;
    --gold: #F0A93A;
    --gold-bg: #FFF6E4;
    --cyan: #6FD8E8;
    --text: #1E2622;
    --text-dim: #5C6B62;
    --line: #E2E8E3;
    --danger: #D64545;
    --silver: #B9BFBB;
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  body{ margin:0; background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  .urdu{ font-family: 'Noto Nastaliq Urdu', serif; direction: rtl; unicode-bidi: embed; line-height: 1.9; }

  .wrap{ max-width: 480px; margin: 0 auto; padding: 18px 14px 60px; }

  .live-banner{
    display:flex; align-items:center; gap: 8px; margin-bottom: 16px;
  }
  .live-dot{
    width: 11px; height: 11px; border-radius: 50%; background: var(--danger);
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(214,69,69,0.55); }
    70%{ box-shadow: 0 0 0 9px rgba(214,69,69,0); }
    100%{ box-shadow: 0 0 0 0 rgba(214,69,69,0); }
  }
  .live-banner .title{ font-size: 20px; font-weight: 700; color: var(--green-dark); }
  .live-banner .sub{ font-size: 12px; color: var(--text-dim); margin-inline-start: auto; }

  .club-title{ font-size: 17px; font-weight: 700; color: var(--green-dark); margin: 22px 0 8px; text-align:center; }
  .club-title:first-of-type{ margin-top: 0; }

  .infobar{
    background: linear-gradient(160deg, var(--green), var(--green-dark));
    color: #fff; border-radius: var(--radius);
    padding: 14px 16px; font-size: 14px; line-height: 1.7;
    margin-bottom: 14px;
  }
  .infobar .line1{ font-weight: 600; }
  .infobar .line2{ opacity: 0.92; }

  .stats{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat{
    background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
    padding: 10px 4px; text-align:center;
  }
  .stat.flying{ border-color: var(--gold); }
  .stat.landed{ border-color: var(--green); }
  .stat .num{ font-size: 22px; font-weight: 700; }
  .stat.flying .num{ color: var(--gold); }
  .stat.landed .num{ color: var(--green); }
  .stat .lbl{ font-size: 10.5px; color: var(--text-dim); letter-spacing: 0.5px; margin-top: 2px; }

  .progress{
    background: var(--gold-bg); border-radius: 20px; height: 34px; position: relative; overflow: hidden;
    margin-bottom: 16px; display:flex; align-items:center;
  }
  .progress .fill{
    position:absolute; left:0; top:0; bottom:0; background: var(--green);
    border-radius: 20px; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size: 12.5px; font-weight: 600;
  }
  .progress .flying-lbl{ position:absolute; left: 10px; font-size: 11.5px; font-weight:600; color: #8a6a1f; }

  .winners{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .winner-card{ border-radius: 12px; padding: 14px 10px; text-align:center; }
  .winner-card.first{ background: var(--gold); }
  .winner-card.pigeon{ background: var(--cyan); }
  .winner-card .lbl{ font-size: 11px; font-weight: 700; letter-spacing: 0.5px; color: rgba(0,0,0,0.65); margin-bottom: 4px; }
  .winner-card .time{ font-size: 26px; font-weight: 700; color: #1a1a1a; }
  .winner-card .wname{ font-size: 15px; margin-top: 2px; color: #1a1a1a; }

  .entry{
    background: var(--entry-bg); border-radius: var(--radius); padding: 14px;
    margin-bottom: 12px;
  }
  .entry-top{ display:flex; align-items:center; gap: 10px; margin-bottom: 10px; }
  .entry-total{ font-size: 22px; font-weight: 700; flex-shrink: 0; }
  .entry-deduction{ font-size: 12px; color: var(--danger); font-weight: 600; }
  .entry-name-wrap{ flex: 1; text-align: right; }
  .entry-name{ font-size: 17px; font-weight: 600; }
  .entry-note{ font-size: 12px; color: var(--danger); margin-top: 2px; }
  .avatar-rank{ position: relative; flex-shrink: 0; }
  .avatar{
    width: 42px; height: 42px; border-radius: 50%; background: var(--green);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight: 700; font-size: 14px; overflow: hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit: cover; }
  .rank-badge{
    position:absolute; bottom:-4px; right:-4px; width: 20px; height: 20px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center; font-size: 10.5px; font-weight: 700;
    color: #fff; border: 2px solid var(--entry-bg);
  }
  .rank-badge.r1{ background: var(--gold); }
  .rank-badge.r2{ background: var(--silver); }
  .rank-badge.r3{ background: #C08A5A; }
  .rank-badge.rn{ background: var(--text-dim); }

  .checkpoints{ display:flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .chip{ background: #fff; border-radius: 8px; padding: 6px 8px; text-align:center; min-width: 52px; flex-shrink:0; }
  .chip .clabel{ font-size: 10px; color: var(--text-dim); }
  .chip .ctime{ font-size: 13px; font-weight: 600; }

  .view-full{ display:block; text-align:center; font-size: 12.5px; font-weight:600; color: var(--green); text-decoration:none; margin: 4px 0 4px; }

  .empty-box{
    text-align:center; padding: 70px 18px; color: var(--text-dim);
  }
  .empty-box .big{ font-size: 42px; margin-bottom: 10px; }
  .empty-box .msg{ font-size: 14.5px; }
  .empty-box .refresh-note{ font-size: 11.5px; margin-top: 10px; color: var(--text-dim); }

  .loading{ padding: 60px 0; text-align:center; color: var(--text-dim); font-size: 13px; }
  .error-box{ padding: 16px; border: 1px solid var(--danger); border-radius: 10px; color: var(--danger); font-size: 13px; margin: 20px 0; }

  footer{ text-align:center; padding: 20px 0 0; }
  footer a{
    color: var(--green); text-decoration:none; border: 1px solid var(--green);
    padding: 7px 16px; border-radius: 20px; font-size: 12.5px; font-weight: 600;
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Loading…</div>
</div>

<script>
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){
  const parts = (name||'').trim().split(/\s+/);
  return parts.slice(0,2).map(p=>p[0]).join('').toUpperCase();
}
function rankClass(i){
  if(i===0) return 'r1';
  if(i===1) return 'r2';
  if(i===2) return 'r3';
  return 'rn';
}

function migrateData(raw){
  if(raw && Array.isArray(raw.clubs)) return raw;
  const meta = (raw && raw.meta) ? raw.meta : {};
  return {
    clubs: [
      {
        id: 'club-1',
        name: meta.club_name || 'Club',
        tournaments: [
          { id: 't-1', meta: meta, columns: (raw && raw.columns) || [], birds: (raw && raw.birds) || [] }
        ]
      }
    ]
  };
}

function isLive(tour){
  const m = tour && tour.meta;
  if(!m) return false;
  return Number(m.flying) > 0;
}

function entriesHtml(club, tour){
  const birds = tour.birds || [];
  const cols = tour.columns || [];
  return birds.map((b, idx) => {
    const avatarInner = b.image ? `<img src="${escapeHtml(b.image)}" alt="">` : escapeHtml(initials(b.name));
    const chips = cols.map((c,i)=>`<div class="chip"><div class="clabel">${escapeHtml(c)}</div><div class="ctime">${escapeHtml(b.times[i]||'—')}</div></div>`).join('');
    return `
      <div class="entry">
        <div class="entry-top">
          <div style="flex-shrink:0;">
            <div class="entry-total">${escapeHtml(b.total)}</div>
            ${b.deduction ? `<div class="entry-deduction">${escapeHtml(b.deduction)}</div>` : ''}
          </div>
          <div class="entry-name-wrap">
            <div class="entry-name urdu">${escapeHtml(b.name)}</div>
            ${b.note ? `<div class="entry-note urdu">${escapeHtml(b.note)}</div>` : ''}
          </div>
          <div class="avatar-rank">
            <div class="avatar">${avatarInner}</div>
            <div class="rank-badge ${rankClass(idx)}">${idx+1}</div>
          </div>
        </div>
        <div class="checkpoints">${chips}</div>
      </div>`;
  }).join('') || '<div class="loading">Abhi koi bird result nahi</div>';
}

function clubBlockHtml(club, tour){
  const m = tour.meta;
  const total = m.pigeons || (Number(m.flying) + Number(m.landed)) || 1;
  const flyingPct = Math.round((Number(m.flying) / total) * 100);
  const landedPct = 100 - flyingPct;
  return `
    <div class="club-title">🕊️ ${escapeHtml(club.name)}</div>
    <div class="infobar">
      <div class="line1">${tour.name ? escapeHtml(tour.name) + ' · ' : ''}${escapeHtml(m.date)} · Uraan time: ${escapeHtml(m.uraan_time)} · Aakhri time: ${escapeHtml(m.aakhri_time)}</div>
      <div class="line2">🌅 Sunrise: ${escapeHtml(m.sunrise)} · 🕌 Sunset: ${escapeHtml(m.sunset)}</div>
    </div>
    <div class="stats">
      <div class="stat flying"><div class="num">${m.flying}</div><div class="lbl">FLYING</div></div>
      <div class="stat landed"><div class="num">${m.landed}</div><div class="lbl">LANDED</div></div>
      <div class="stat"><div class="num">${m.pigeons}</div><div class="lbl">PIGEONS</div></div>
      <div class="stat"><div class="num">${m.lofts}</div><div class="lbl">LOFTS</div></div>
    </div>
    <div class="progress">
      <span class="flying-lbl">flying ${flyingPct}%</span>
      <div class="fill" style="width:${landedPct}%">landed ${landedPct}%</div>
    </div>
    <div class="winners">
      <div class="winner-card first">
        <div class="lbl">FIRST WINNER</div>
        <div class="time">${escapeHtml(m.first_winner_time)}</div>
        <div class="wname urdu">${escapeHtml(m.first_winner_name)}</div>
      </div>
      <div class="winner-card pigeon">
        <div class="lbl">WINNER PIGEON</div>
        <div class="time">${escapeHtml(m.winner_pigeon_time)}</div>
        <div class="wname urdu">${escapeHtml(m.winner_pigeon_name)}</div>
      </div>
    </div>
    <a class="view-full" href="club.html?club=${encodeURIComponent(club.id)}&t=${encodeURIComponent(tour.id)}">Pura result dekhein →</a>
    ${entriesHtml(club, tour)}
  `;
}

function render(raw){
  const data = migrateData(raw);
  const clubs = data.clubs || [];

  const liveList = [];
  clubs.forEach(club => {
    const tournaments = club.tournaments || [];
    const latest = tournaments[tournaments.length - 1];
    if(latest && isLive(latest)) liveList.push({ club, tour: latest });
  });

  if(liveList.length === 0){
    document.getElementById('app').innerHTML = `
      <div class="live-banner">
        <div class="title">🔴 Live Tournament</div>
      </div>
      <div class="empty-box">
        <div class="big">🕊️</div>
        <div class="msg">Abhi koi tournament live nahi hai</div>
        <div class="refresh-note">Yeh page har 30 second baad khud check karta hai</div>
      </div>
      <footer><a href="clubs.html">← Sab Clubs dekhein</a></footer>
    `;
    return;
  }

  const blocks = liveList.map(x => clubBlockHtml(x.club, x.tour)).join('<div style="height:8px;"></div>');

  document.getElementById('app').innerHTML = `
    <div class="live-banner">
      <div class="live-dot"></div>
      <div class="title">Live Tournament</div>
      <div class="sub">${liveList.length} club${liveList.length===1?'':'s'} live</div>
    </div>
    ${blocks}
    <footer><a href="clubs.html">← Sab Clubs dekhein</a></footer>
  `;
}

function loadData(){
  fetch('./data.json?t=' + Date.now(), { cache: 'no-store' })
    .then(r => { if(!r.ok) throw new Error('data.json not found'); return r.json(); })
    .then(render)
    .catch(err => {
      document.getElementById('app').innerHTML =
        '<div class="error-box">Couldn\'t load data.json — make sure it\'s uploaded in the same folder as this page. (' + err.message + ')</div>' +
        '<footer><a href="clubs.html">← Clubs</a></footer>';
    });
}

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
