<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pigeon Clubs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  :root{
    --green: #4C7A5E;
    --green-dark: #3C6249;
    --bg: #F5F7F5;
    --card: #FFFFFF;
    --gold: #F0A93A;
    --gold-bg: #FFF6E4;
    --text: #1E2622;
    --text-dim: #5C6B62;
    --line: #E2E8E3;
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
  }
  .urdu{ font-family: 'Noto Nastaliq Urdu', serif; direction: rtl; unicode-bidi: embed; line-height: 1.9; }

  .wrap{ max-width: 480px; margin: 0 auto; padding: 18px 14px 60px; }

  .page-title{ font-size: 22px; font-weight: 700; margin: 4px 0 4px; color: var(--green-dark); }
  .page-sub{ font-size: 13.5px; color: var(--text-dim); margin: 0 0 18px; }

  .club-card{
    display:block; text-decoration:none; color:inherit;
    border-radius: var(--radius); overflow:hidden;
    margin-bottom: 16px; background: var(--card);
    border: 1px solid var(--line);
  }
  .club-banner{
    background: linear-gradient(160deg, var(--green), var(--green-dark));
    color:#fff; padding: 22px 18px 18px; position: relative; min-height: 84px;
  }
  .club-badge{
    position:absolute; top: 14px; right: 16px;
    background: rgba(255,255,255,0.18); backdrop-filter: blur(2px);
    padding: 5px 12px; border-radius: 20px; font-size: 11.5px; font-weight: 600;
  }
  .club-name{ font-size: 19px; font-weight: 700; max-width: 75%; line-height: 1.3; }
  .club-icon{ position:absolute; bottom: 10px; left: 16px; font-size: 22px; opacity: 0.35; }
  .club-body{ padding: 12px 16px 16px; }
  .club-latest-lbl{ font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px; color: var(--gold); margin-bottom: 2px; }
  .club-latest-date{ font-size: 13.5px; color: var(--text-dim); }

  .loading{ padding: 60px 0; text-align:center; color: var(--text-dim); font-size: 13px; }
  .error-box{ padding: 16px; border: 1px solid #D64545; border-radius: 10px; color: #D64545; font-size: 13px; margin: 20px 0; }

  footer{ text-align:center; padding: 20px 0 0; }
  footer a{
    color: var(--green); text-decoration:none; border: 1px solid var(--green);
    padding: 7px 16px; border-radius: 20px; font-size: 12.5px; font-weight: 600;
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Loading clubs…</div>
</div>

<script>
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Converts an old single-tournament data.json (meta/columns/birds) into the
// new clubs -> tournaments structure, so this page keeps working even if the
// admin panel hasn't republished in the new format yet.
function migrateData(raw){
  if(raw && Array.isArray(raw.clubs)) return raw;
  const meta = (raw && raw.meta) ? raw.meta : {};
  return {
    clubs: [
      {
        id: 'club-1',
        name: meta.club_name || 'Club',
        tournaments: [
          { id: 't-1', meta: meta, columns: (raw && raw.columns) || [], birds: (raw && raw.birds) || [] }
        ]
      }
    ]
  };
}

function render(raw){
  const data = migrateData(raw);
  const clubs = data.clubs || [];

  if(clubs.length === 0){
    document.getElementById('app').innerHTML = '<div class="loading">Abhi koi club add nahi hua</div><footer><a href="admin.html">⚙ Admin Panel</a></footer>';
    return;
  }

  const cards = clubs.map(club => {
    const tournaments = club.tournaments || [];
    const count = tournaments.length;
    const latest = tournaments[tournaments.length - 1];
    const latestDate = latest && latest.meta ? (latest.meta.date || '') : '';
    return `
      <a class="club-card" href="club.html?club=${encodeURIComponent(club.id)}">
        <div class="club-banner">
          <div class="club-badge">${count} tournament${count === 1 ? '' : 's'}</div>
          <div class="club-name">${escapeHtml(club.name)}</div>
          <div class="club-icon">🕊️</div>
        </div>
        <div class="club-body">
          <div class="club-latest-lbl">LATEST</div>
          <div class="club-latest-date">${escapeHtml(latestDate || 'Koi tournament nahi')}</div>
        </div>
      </a>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="page-title">🕊️ Pigeon Clubs</div>
    <div class="page-sub">Kisi club par click karein uske results aur tournament history dekhne ke liye</div>
    ${cards}
    <footer><a href="admin.html">⚙ Admin Panel</a></footer>
  `;
}

fetch('./data.json?t=' + Date.now(), { cache: 'no-store' })
  .then(r => { if(!r.ok) throw new Error('data.json not found'); return r.json(); })
  .then(render)
  .catch(err => {
    document.getElementById('app').innerHTML =
      '<div class="error-box">Couldn\'t load data.json — make sure it\'s uploaded in the same folder as this page. (' + err.message + ')</div>' +
      '<footer><a href="admin.html">⚙ Admin Panel</a></footer>';
  });
</script>
</body>
</html>
